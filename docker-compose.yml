services: #"الخدمات (Containers) اللي المشروع محتاجها."
  db:
    image: postgres:15
    environment:            #أول مرة PostgreSQL يشتغل محتاج يعرفهم عشان ينشئهم وطبعا الايمدج متجهزة فى كودها انها تاخدهم من ال envir. 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mydb                   
    ports:
      - "5432:5432"     #اللى محتاجاه هناexpose اصلا بس خليه عشان لو عوزت افتح pgAdmin من جهازى واشوف الجداول.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .       # يبنى الدوكر فايل اللى عملته عشان بطلع الايمدج
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:    #هنا Docker نفسها قبل ما تشغل Python تحطهم فى ال enviroment بتاعة الكونتينر لاننا بنعمل ignor for .env file ,, 
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mydb  
      #dbهو اسم الـ Service و Docker Network تعرف توصله تلقائيًا. 
      #localhost معناها "نفس الجهاز اللي الكود شغال عليه فلو كنا عملناها كان هيدور على PostgreSQL جوه نفس الـ api Container
      SECRET_KEY: ${SECRET_KEY}
      #الاتنين لازم يطابق اللى فوقPostgreSQL بيعمل الـ user بالـ password ده والـ API بتستخدمه عشان تتصل لو اختلفوا مش هيتصلوا.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
volumes:
  postgres_data:      
  #هنا ده تعريف يعنى بينشأالفولدر اللى اتعمله volume فوق فيلاقيه .(دوكر هو اللى بنشأه فى مكان داخلى وبيديره)
  #وده اسمه Named Volume بدل Bind Mount اللى هو انا اللى اعمل الملف على الجهاز بايدى واديله مساره لان المسار بيختلف من جهاز لجهاز
  #خدى بالك الـ volumes في الآخر مش تابع لـ services ده على مستوى الـ docker-compose كله. 
